# Self-contained compile test - see README.md in this folder.
esphome:
  name: test-philips-fan-only

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  # GPIO20/21 are the C3's UART0 pins and GPIO20 carries the MCU link, so the
  # logger has to go somewhere else.
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

# Dummy credentials on purpose - these tests must build without a secrets.yaml.
# philips.cpp pulls in network headers, so a network component must be present.
wifi:
  ssid: "compile-test"
  password: "compile-test"

api:
  encryption:
    key: "mfEv/h5ZAzrr46UQ/Mt35PpgcbVPFlPNhlLMZzAol4w="

external_components:
  - source: ../..
    components: [philips]

uart:
  - id: uart_mcu
    rx_pin: GPIO20
    tx_pin: GPIO10
    baud_rate: 115200

philips:
  id: purifier
  model: AC0650
  uart_id: uart_mcu

fan:
  - platform: philips
    philips: purifier
    name: "Fan"
